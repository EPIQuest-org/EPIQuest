name: Task
description: A technical, documentation or maintenance task
title: "[Task] "
labels: ["chore"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - docs
        - chore
        - refactor
        - test
        - ci
        - build
        - perf
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done, and why?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] ...
        - [ ] Documentation updated
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - server
        - mobile
        - rules-engine
        - dice
        - maps
        - combat
        - sync (GM and player views)
        - database
        - accessibility
        - docs
        - ci
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Related issues, ADRs, or documents.